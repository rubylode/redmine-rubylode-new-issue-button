# A throwaway Redmine 7 to try the plugin in. Not the real tracker.
# Start: ruby bin/demo up (with demo data) or docker compose up -d (bare), then open http://localhost:3011 (admin / admin, change it on first login).
# The repository is mounted as the plugin, so a code change shows after "docker compose restart redmine".
# Wipe it: docker compose down -v
# Tests: docker compose run --rm test (see bin/test)
services:
  redmine:
    image: redmine:7.0.2
    container_name: redmine-new-issue-button-dev
    ports:
      - "127.0.0.1:3011:3000"
    environment:
      # The image ships without the development gems, so production is the mode it can boot in.
      RAILS_ENV: production
    volumes:
      - .:/usr/src/redmine/plugins/redmine_rubylode_new_issue_button
      - redmine-new-issue-button-files:/usr/src/redmine/files
      - redmine-new-issue-button-sqlite:/usr/src/redmine/sqlite

  test:
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    profiles: ["test"]
    environment:
      RAILS_ENV: test
    volumes:
      - .:/usr/src/redmine/plugins/redmine_rubylode_new_issue_button

volumes:
  redmine-new-issue-button-files:
  redmine-new-issue-button-sqlite:
